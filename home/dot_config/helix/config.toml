# Helix — keyboard-first editor (ADR-0008 / PLAN Phase 5).
# Single config, no OS variation. Theme kept consistent with the rest of the stack.
theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = true                 # mouse as backup
true-color = true
color-modes = true
bufferline = "multiple"      # VS Code-like buffer tabs

[editor.file-picker]
hidden = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.auto-save]
focus-lost = true
